<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSlice</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<div class="logo">
<img src="assets/logo.svg">
CSlice
</div>


<div class="top-buttons">

<button>
Open STL
</button>

<button>
Save Project
</button>

</div>

</header>



<div class="slicer">



<aside class="settings">


<h2>Printer</h2>

<select>
<option>Creality K2 Plus</option>
<option>Bambu Lab X1C</option>
<option>Prusa MK4</option>
</select>



<h2>Filament</h2>

<select>
<option>PLA</option>
<option>PLA HS</option>
<option>PETG</option>
<option>PETG HS</option>
<option>ABS</option>
<option>ABS hs</option>
<option>ASA</option>
<option>ASA HS</option>
</select>




<h2>Layer Height</h2>

<select>
<option>0.20mm Standard</option>
<option>0.12mm High Quality</option>
<option>0.28mm Fast</option>
</select>




<h2>Infill Percentage</h2>


<label>
Density:
<span id="infillNumber">20</span>%
</label>


<input 
type="range"
id="infillSlider"
min="0"
max="100"
value="20">


<label>
Pattern
</label>


<div class="patterns">


<button class="pattern selected">

<img src="assets/infill/grid.svg">

Grid

</button>



<button class="pattern">

<img src="assets/infill/gyroid.svg">

Gyroid

</button>



<button class="pattern">

<img src="assets/infill/cubic.svg">

Cubic

</button>



<button class="pattern">

<img src="assets/infill/honeycomb.svg">

Triangles

</button>



<button class="pattern">

<img src="assets/infill/lines.svg">

Lines

</button>



<button class="pattern">

<img src="assets/infill/lightning.svg">

Lightning

</button>



</div>



<button class="slice">

Slice Plate

</button>



</aside>





<section class="viewer">


<h2>3D Preview</h2>


<div class="model">

</div>



<div class="info">

No model loaded

</div>


</section>



</div>



<script src="js/app.js"></script>


</body>

</html>
